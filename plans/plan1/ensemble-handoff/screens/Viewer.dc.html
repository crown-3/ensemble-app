<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Ensemble결과물 뷰어</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #0a6ae0;outline-offset:2px}
</style>
</helmet>
<aside aria-label="결과물 뷰어" style="width: 640px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-left: 1px solid #dedee2; color: #1d1d1f; font-family: 'Asta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; line-height: 16px">
<header style="height: 52px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: #f7f7f9; border-bottom: 1px solid #dedee2">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#636368" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" style="flex-shrink: 0"><path d="M4 2h5l3 3v9H4z"></path><path d="M9 2v3h3M6 8.5h4M6 11h4"></path></svg>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 13px; line-height: 16px; font-weight: 700">hero-copy.md</h1>
<div style="font-size: 11px; line-height: 14px; color: #636368">도윤 · 카피라이터가 생성</div>
</div>
<button style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border: 1px solid rgba(0,0,0,0.12); border-radius: 999px; background: #ffffff"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7.5L8 11l3.5-3.5M3 13.5h10"></path></svg><span>다운로드</span></button>
<button aria-label="닫기" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #636368; padding: 0"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
</header>

<div role="tablist" aria-label="버전" style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px 16px; border-bottom: 1px solid #dedee2">
<button role="tab" aria-selected="true" style="height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: #e9e9ec; font-weight: 600">v2 · 최신</button>
<button role="tab" aria-selected="false" style="height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent">v1</button>
<span style="flex-grow: 1"></span>
<span style="font-size: 11px; line-height: 14px; color: #636368">오늘 오전 10:06에 수정됨</span>
</div>

<div style="flex-grow: 1; overflow-y: auto; padding: 24px">
<article style="max-width: 520px; display: flex; flex-direction: column; gap: 16px; font-size: 13px; line-height: 17px">
<h2 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600">히어로 카피 초안</h2>
<section style="display: flex; flex-direction: column; gap: 4px">
<h3 style="margin: 0; font-size: 13px; line-height: 17px; font-weight: 700">1. 기능 중심</h3>
<div>헤드라인: [헤드라인 문구]</div>
<div style="color: #636368">서브 카피: [서브 카피 문구]</div>
</section>
<section style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 8px; background: #f1f1f3">
<h3 style="margin: 0; font-size: 13px; line-height: 17px; font-weight: 700">2. 감성 중심</h3>
<div>헤드라인: [줄인 헤드라인 문구]</div>
<div style="color: #636368">서브 카피: [서브 카피 문구]</div>
<div style="font-size: 11px; line-height: 14px; color: #636368">v2에서 변경된 부분</div>
</section>
<section style="display: flex; flex-direction: column; gap: 4px">
<h3 style="margin: 0; font-size: 13px; line-height: 17px; font-weight: 700">3. 가격 중심</h3>
<div>헤드라인: [헤드라인 문구]</div>
<div style="color: #636368">서브 카피: [서브 카피 문구]</div>
</section>
</article>
</div>

<section style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #f1f1f3; border-top: 1px solid #dedee2">
<h2 style="margin: 0; font-size: 11px; line-height: 14px; font-weight: 600; color: #636368">버전 기록</h2>
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; font-weight: 700">v2</span><span style="flex-grow: 1">도윤이 2번 방향의 헤드라인을 줄임</span><span style="font-size: 11px; line-height: 14px; color: #636368">오전 10:06</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; font-weight: 700">v1</span><span style="flex-grow: 1">도윤이 파일을 생성함</span><span style="font-size: 11px; line-height: 14px; color: #636368">오전 10:04</span></div>
</section>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
