<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Ensemble전역 역할 설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0a62d0}a:hover{color:#084fa8}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #0a6ae0;outline-offset:2px}
@media (max-width: 860px){.avec-shell{flex-direction:column !important;height:auto !important}.avec-side{width:auto !important;border-right:0 !important}}
</style>
</helmet>
<div class="avec-shell" style="display: flex; height: 100vh; box-sizing: border-box; background: #ffffff; color: #1d1d1f; font-family: 'Asta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; line-height: 16px">

<nav class="avec-side" aria-label="프로젝트와 채팅" style="width: 280px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; background: #f1f1f3; border-right: 1px solid #dedee2">
<div style="height: 52px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; border-bottom: 1px solid #dedee2">
<a href="Main.dc.html" style="font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: 0.04em; color: #1d1d1f; text-decoration: none; display: flex; align-items: center; gap: 8px"><img src="../assets/logo.png" alt="" style="width: 25px; height: 26px; mix-blend-mode: multiply"></a>
<a href="NewChat.dc.html" aria-label="새 채팅" style="width: 32px; height: 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,0.12); border-radius: 999px; background: #ffffff; color: #636368"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8.5V13H3V3h4.5"></path><path d="M11.5 2.5l2 2L8 10H6V8z"></path></svg></a>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; padding: 4px 8px; font-size: 11px; line-height: 14px; font-weight: 600; color: #636368">프로젝트</h2>
<a href="ProjectHome.dc.html" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 8px; color: #1d1d1f; text-decoration: none; font-weight: 700"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#636368" stroke-width="1.5" stroke-linejoin="round"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"></path></svg><span>브랜드 리뉴얼</span></a>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px 0 32px; border-radius: 8px; color: #1d1d1f; text-decoration: none">랜딩 페이지 카피 초안</a>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px 0 32px; border-radius: 8px; color: #1d1d1f; text-decoration: none">네이밍 후보 검토</a>
<a href="ProjectHome.dc.html" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 8px; color: #1d1d1f; text-decoration: none; font-weight: 700"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#636368" stroke-width="1.5" stroke-linejoin="round"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"></path></svg><span>주간 리포트 자동화</span></a>
<h2 style="margin: 14px 0 0 0; padding: 4px 8px; font-size: 11px; line-height: 14px; font-weight: 600; color: #636368">채팅</h2>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 8px; color: #1d1d1f; text-decoration: none">아이디어 메모 정리</a>
<a href="Main.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 8px; color: #1d1d1f; text-decoration: none">회의록 요약</a>
</div>
<div style="flex-shrink: 0; padding: 8px; border-top: 1px solid #dedee2; display: flex; flex-direction: column; gap: 2px">
<a href="Agents.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 8px; background: #0a6ae0; color: #ffffff; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4.5h7M12.5 4.5H14M2 11.5h1.5M7 11.5h7"></path><circle cx="10.75" cy="4.5" r="1.75"></circle><circle cx="5.25" cy="11.5" r="1.75"></circle></svg><span>전역 역할 설정</span></a>
<a href="Settings.dc.html" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 8px; color: #1d1d1f; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8l5.4 3.1v6.2L8 14.2l-5.4-3.1V4.9z"></path><circle cx="8" cy="8" r="2"></circle></svg><span>앱 설정</span></a>
</div>
</nav>

<main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff">
<header style="height: 52px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #f7f7f9; border-bottom: 1px solid #dedee2">
<h1 style="margin: 0; flex-grow: 1; font-size: 13px; line-height: 16px; font-weight: 700">전역 역할 설정</h1>
<a href="AgentEdit.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 16px; border-radius: 999px; background: #0a6ae0; color: #ffffff; font-weight: 600; text-decoration: none; white-space: nowrap">에이전트 추가</a>
</header>
<div style="flex-grow: 1; overflow-y: auto; padding: 32px 24px">
<div style="max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700">에이전트 회사원</h2>
<p style="margin: 0; color: #636368; font-size: 13px; line-height: 17px">에이전트의 기본 속성을 관리합니다. 여기에서 변경한 내용은 모든 프로젝트와 채팅에 적용됩니다.</p>
</div>

<section style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid #dedee2; border-radius: 14px">
<h3 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600">전역 지침</h3>
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="color: #636368">모든 에이전트에게 공통으로 전달됩니다. 전역 지침, 프로젝트 지침, 에이전트의 페르소나 순서로 적용됩니다.</span>
<textarea rows="4" style="box-sizing: border-box; width: 100%; padding: 8px 12px; border: 1px solid #8a8a8f; border-radius: 8px; background: #ffffff; font-size: 13px; line-height: 17px; resize: vertical">항상 한국어로 답합니다. 다른 에이전트의 결과물을 수정하기 전에 무엇을 바꿀지 먼저 알립니다. 확인하지 못한 내용은 추정이라고 밝힙니다.</textarea>
</label>
<button style="align-self: flex-end; height: 32px; padding: 0 16px; border: 0; border-radius: 999px; background: #0a6ae0; color: #ffffff; font-weight: 600">지침 저장</button>
</section>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px">
<sc-for list="{{agents}}" as="a" hint-placeholder-count="5">
<article style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid #dedee2; border-radius: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 56px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: {{a.tint}}; font-size: 20px; font-weight: 700">{{a.initial}}</span>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
<h3 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600">{{a.name}}</h3>
<div style="color: #636368">{{a.role}}</div>
</div>
</div>
<div style="align-self: flex-start; padding: 4px 8px; border-radius: 999px; background: #f1f1f3; font-size: 11px; line-height: 14px; font-weight: 600">{{a.model}}</div>
<p style="margin: 0; flex-grow: 1; font-size: 12px; line-height: 15px; color: #636368">{{a.persona}}</p>
<div style="display: flex; align-items: center; gap: 4px; padding-top: 8px; border-top: 1px solid #dedee2">
<a href="AgentEdit.dc.html" style="display: flex; align-items: center; height: 28px; padding: 0 8px; text-decoration: none">편집</a>
<button style="height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #0a62d0">복제</button>
<span style="flex-grow: 1"></span>
<button style="height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #c9001a">삭제</button>
</div>
</article>
</sc-for>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
return { agents: [
{ name: '서윤', initial: '서', role: '기획 리드', model: 'Claude · Opus 5.5', tint: '#dfe6f1', persona: '요청을 작업 단위로 나누고 담당자를 정합니다. 결론을 먼저 말하고 근거를 덧붙입니다.' },
{ name: '도윤', initial: '도', role: '카피라이터', model: 'GPT · Sol 6.1', tint: '#e8e2d6', persona: '짧고 분명한 문장을 씁니다. 초안은 항상 두 가지 이상의 안으로 제시합니다.' },
{ name: '한서', initial: '한', role: '디자이너', model: 'Gemini · Flash 3.1 Pro', tint: '#dde9e1', persona: '시안을 이미지로 먼저 보여주고, 선택한 이유를 한 문단으로 설명합니다.' },
{ name: '지안', initial: '지', role: '리서처', model: 'Claude · Opus 5.5', tint: '#eadfe6', persona: '자료의 출처를 반드시 밝히고, 확인하지 못한 내용은 추정이라고 표시합니다.' },
{ name: '태오', initial: '태', role: '개발자', model: 'GPT · Sol 6.1', tint: '#e3e3ea', persona: '동작하는 코드를 우선하고, 변경한 파일과 이유를 목록으로 남깁니다.' }
] };
}
}
</script>
</body>
</html>
